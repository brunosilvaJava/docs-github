name: Copiar markdown das docs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python copiar_markdown.py urls.txt --out markdown
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add markdown
          git diff --cached --quiet || (git commit -m "Atualiza markdown das docs" && git push)